[project]
name = "gov-portal"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "PyYAML>=6.0.2,<7", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["app/functions"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
